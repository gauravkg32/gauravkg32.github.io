---
layout: default
---
<article class="page">
  <div class="container">
    <p class="eyebrow">{{ page.date | date: "%b %d, %Y" }}{% if page.read_time %} · {{ page.read_time }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    <div class="prose">{{ content }}</div>
    <a href="{{ '/blog/' | relative_url }}">← All posts</a>
  </div>
</article>
