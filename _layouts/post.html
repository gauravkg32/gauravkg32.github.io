---
layout: default
---
<article class="wrap post">
  <p class="mono muted">{{ page.date | date: "%b %d, %Y" }}{% if page.read_time %} · {{ page.read_time }}{% endif %}</p>
  <h1>{{ page.title }}</h1>
  <div class="prose">{{ content }}</div>
  <p><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
</article>
