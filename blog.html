---
layout: default
title: Blog
permalink: /blog/
---
<section class="wrap">
  <h1>Blog</h1>
  <ul class="posts">
    {% for post in site.posts %}
    <li><a href="{{ post.url | relative_url }}">{{ post.title }}</a><span class="mono muted">{{ post.date | date: "%b %d, %Y" }}</span>
      {% if post.excerpt %}<p class="muted">{{ post.excerpt | strip_html | truncate: 160 }}</p>{% endif %}</li>
    {% endfor %}
  </ul>
</section>
