---
layout: default
title: Blog
permalink: /blog/
---
<section class="page">
  <div class="container">
    <p class="eyebrow">Blog</p>
    <h1>Notes from the studio</h1>
    <ul class="post-list">
      {% for post in site.posts %}
      <li>
        <p class="muted small">{{ post.date | date: "%b %d, %Y" }}</p>
        <a href="{{ post.url | relative_url }}">{{ post.title }}</a>
        {% if post.excerpt %}<p class="muted">{{ post.excerpt | strip_html | truncate: 160 }}</p>{% endif %}
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
